services:
  # === Aplikasi Laravel (PHP-FPM) ===
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: toko_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-toko_db}
      - DB_USERNAME=${DB_USERNAME:-toko_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - toko-network

  # === Web server ===
  webserver:
    image: nginx:1.27-alpine
    container_name: toko_webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - toko-network

  # === Database MySQL ===
  db:
    image: mysql:8.0
    container_name: toko_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootsecret}
      - MYSQL_DATABASE=${DB_DATABASE:-toko_db}
      - MYSQL_USER=${DB_USERNAME:-toko_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    volumes:
      - toko-db-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - toko-network

  # === Node (build/dev asset Tailwind + Vite) ===
  node:
    image: node:20-alpine
    container_name: toko_node
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    ports:
      - "${VITE_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - toko-network
    profiles:
      - dev

  # === phpMyAdmin (opsional, memudahkan lihat data selama development) ===
  phpmyadmin:
    image: phpmyadmin:5
    container_name: toko_phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      - db
    networks:
      - toko-network
    profiles:
      - dev

networks:
  toko-network:
    driver: bridge

volumes:
  toko-db-data:
    driver: local