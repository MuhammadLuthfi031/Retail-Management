# Dasar bersama untuk container Laravel (web `app` dan penjadwal `scheduler`):
# image, volume, dan environment HARUS sama persis supaya penjadwal melihat database
# dan folder backup yang sama dengan aplikasi.
x-laravel: &laravel
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: toko-app-php
  restart: unless-stopped
  working_dir: /var/www
  volumes:
    - ./src:/var/www
    # Folder backup DI LUAR volume database (toko-db-data): `docker compose down -v`
    # tidak ikut menghapus backup. Arahkan BACKUP_HOST_PATH ke disk eksternal / folder
    # jaringan untuk salinan di luar komputer toko (lihat .env.docker.example).
    - ${BACKUP_HOST_PATH:-./backups}:/backups
  environment:
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-toko_db}
    DB_USERNAME: ${DB_USERNAME:-toko_user}
    # TANPA nilai bawaan (QA-010): password wajib diisi sendiri di file .env.
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD belum diisi di file .env - lihat .env.docker.example}
    BACKUP_PATH: /backups
  depends_on:
    db:
      condition: service_healthy
  networks:
    - toko-network

services:
  # === Aplikasi Laravel (PHP-FPM) ===
  app:
    <<: *laravel
    container_name: toko_app

  # === Penjadwal (backup otomatis harian + tombol "Backup Sekarang") ===
  # Tanpa container ini TIDAK ADA backup otomatis. Admin diperingatkan di dashboard
  # bila penjadwal berhenti.
  scheduler:
    <<: *laravel
    container_name: toko_scheduler
    command: php artisan schedule:work

  # === Web server ===
  webserver:
    image: nginx:1.27-alpine
    container_name: toko_webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
      - "${APP_SSL_PORT:-8443}:443"
    environment:
      # Dipakai envsubst (lihat docker/nginx/templates/default.conf.template)
      # supaya redirect HTTP->HTTPS mengarah ke port HTTPS yang benar-benar
      # dipakai di host, bukan hardcode 443.
      - APP_HTTPS_PORT=${APP_SSL_PORT:-8443}
    volumes:
      - ./src:/var/www
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - toko-network

  # === Database MySQL ===
  db:
    image: mysql:8.0
    container_name: toko_db
    restart: unless-stopped
    environment:
      # TANPA nilai bawaan (QA-010): kedua password wajib diisi di file .env.
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD belum diisi di file .env - lihat .env.docker.example}
      - MYSQL_DATABASE=${DB_DATABASE:-toko_db}
      - MYSQL_USER=${DB_USERNAME:-toko_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:?DB_PASSWORD belum diisi di file .env - lihat .env.docker.example}
    ports:
      # Hanya bisa diakses dari komputer server itu sendiri (127.0.0.1), TIDAK dari
      # perangkat lain di jaringan toko (QA-010). Aplikasi tetap terhubung lewat
      # jaringan Docker internal (host "db"), tidak lewat port ini.
      - "127.0.0.1:${DB_PORT_HOST:-3306}:3306"
    volumes:
      - toko-db-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      # Password dibaca dari environment container (bukan disisipkan ke perintah).
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - toko-network

  # === Node (build/dev asset Tailwind + Vite) ===
  node:
    image: node:20-alpine
    container_name: toko_node
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    ports:
      - "${VITE_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - toko-network
    profiles:
      - dev

  # === phpMyAdmin — HANYA UNTUK DEVELOPMENT ===
  # Tidak menyala kecuali `docker compose --profile dev up`. Login otomatis sebagai root,
  # jadi JANGAN pernah diaktifkan di server toko. Port terikat ke 127.0.0.1.
  phpmyadmin:
    image: phpmyadmin:5
    container_name: toko_phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD belum diisi di file .env - lihat .env.docker.example}
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    depends_on:
      - db
    networks:
      - toko-network
    profiles:
      - dev

networks:
  toko-network:
    driver: bridge

volumes:
  toko-db-data:
    driver: local