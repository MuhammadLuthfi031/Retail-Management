; Nama file SENGAJA diawali "zz-" — php-fpm.conf bawaan image resmi memuat
; semua file di /usr/local/etc/php-fpm.d/*.conf terurut alfabetis, jadi file
; ini dimuat SETELAH www.conf bawaan. Directive [www] di sini menimpa yang
; sama persis di www.conf, TANPA perlu mendefinisikan ulang user/group/listen
; — biarkan itu tetap seperti bawaan image, supaya tidak bentrok dengan user
; non-root (`appuser`) yang sudah dipakai container ini (lihat Dockerfile).
;
; Kenapa angka-angka di bawah (bukan asal dinaikkan, lihat §5 temuan #2):
; - Skala 1 toko: realistisnya 2-4 kasir + 1-2 admin/gudang aktif bersamaan
;   -> permintaan PHP bersamaan jarang lebih dari 5-8 di satu waktu.
; - RAM server 2-4GB (dikonfirmasi pemilik proyek) — MySQL + Nginx + OS makan
;   sebagian, sisa untuk PHP-FPM diperkirakan konservatif ~1GB.
; - memory_limit di php.ini = 256M = batas ATAS per proses (bukan pemakaian
;   normal, cuma worst-case kalau 1 proses genuinely butuh sebanyak itu,
;   misal PDF laporan dengan rentang tanggal besar). Worst-case teoretis
;   SEMUA worker sekaligus kena batas atas: 10 x 256MB = 2560MB — skenario
;   ini sangat tidak mungkin (butuh 10 request PDF bersamaan, sudah dibatasi
;   throttle:10,1 di route PDF), tapi dihitung transparan di sini supaya
;   angkanya bisa disesuaikan sendiri kalau spesifikasi server berbeda dari
;   perkiraan ini.
[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
; Recycle worker tiap 500 request — jaga-jaga kebocoran memori bertahap
; (mis. dari Dompdf/ekstensi pihak ketiga), bukan tanda ada bug spesifik yang
; diketahui saat ini.
pm.max_requests = 500